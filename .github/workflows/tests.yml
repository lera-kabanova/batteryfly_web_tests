name: Selenium Tests

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 1. Запуск тестов модуля Auth
      - name: Run Auth tests
        run: mvn test -Dtest="AuthSmokeTest,AuthNegativeTest,AuthSecurityTest,AuthSessionTest,AuthLogoutTest,AuthUiTest"
        continue-on-error: true

      # 1a. Краткая сводка по тестам прямо в Summary прогона GitHub Actions
      - name: Publish Test Summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: 'JUnit Test Report'

      # 2. Скачивание истории прошлых прогонов из ветки gh-pages
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # 3. Собираем json-файлы из auth/target/allure-results в корневую папку target/allure-results
      - name: Collect Allure Results from Submodules
        if: always()
        run: |
          mkdir -p target/allure-results
          # Ищем все файлы результатов из всех подмодулей (auth, etc.) и копируем в корень
          find . -type f -path "*/target/allure-results/*" -exec cp {} target/allure-results/ \; || true
          
          echo "=== Собранные файлы результатов ==="
          ls -la target/allure-results

      # 4. Установка Allure CLI
      - name: Install Allure CLI
        if: always()
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -zxvf allure-2.29.0.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure || true

      # 5. Копируем историю прошлых отчетов (чтобы строились графики)
      - name: Copy Allure history
        if: always()
        run: |
          mkdir -p target/allure-results/history
          if [ -d "gh-pages/history" ]; then
            cp -r gh-pages/history/* target/allure-results/history/ || true
          fi

      # 6. Генерация Allure HTML-отчета
      - name: Generate Allure Report
        if: always()
        run: allure generate target/allure-results --clean -o allure-report

      # 7. Сохранение истории для следующих запусков
      - name: Preserve Allure history
        if: always()
        run: |
          cp -r allure-report/history gh-pages/history || true

      # 8. Публикация отчета на GitHub Pages
      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report