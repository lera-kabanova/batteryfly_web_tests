name: Selenium Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 1. Запуск Auth-тестов; continue-on-error, чтобы упавший тест не обрывал сборку отчёта
      - name: Run Auth tests
        run: mvn test -Dtest="AuthSmokeTest,AuthNegativeTest,AuthSecurityTest,AuthSessionTest,AuthLogoutTest,AuthUiTest"
        continue-on-error: true

      # 2. Краткая сводка по тестам прямо в Summary прогона GitHub Actions
      - name: Publish Test Summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: 'JUnit Test Report'

      # 3. Установка Allure CLI
      - name: Install Allure CLI
        if: always()
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -zxvf allure-2.29.0.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure || true

      # 4. Генерация Allure HTML-отчета
      - name: Generate Allure Report
        if: always()
        run: |
          mkdir -p target/allure-results
          allure generate target/allure-results --clean -o allure-report

      # 5. Публикация отчета как artifact прогона (скачивается прямо со страницы Actions)
      - name: Upload Allure Report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report