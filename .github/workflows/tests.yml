name: Selenium Tests

run-name: Selenium Tests - ${{ inputs.suite }}

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: true
        default: auth
        type: choice
        options:
          - auth
          - registration
          - registration-new-user
          - navigation
          - charging
          - all

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: |
          case "${{ inputs.suite }}" in
            all)
              PATTERN="org.example.**"
              ;;
            registration)
              PATTERN="org.example.registration.**,!org.example.registration.RegistrationNewUserTest"
              ;;
            registration-new-user)
              PATTERN="org.example.registration.RegistrationNewUserTest"
              ;;
            *)
              PATTERN="org.example.${{ inputs.suite }}.**"
              ;;
          esac
          mvn test -Dtest="$PATTERN"
        continue-on-error: true

      - name: Publish Test Summary
        if: always()
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: '**/target/surefire-reports/TEST-*.xml'
          check_name: 'JUnit Test Report'

      - name: Install Allure CLI
        if: always()
        run: |
          wget https://github.com/allure-framework/allure2/releases/download/2.29.0/allure-2.29.0.tgz
          tar -zxvf allure-2.29.0.tgz
          sudo mv allure-2.29.0 /opt/allure
          sudo ln -s /opt/allure/bin/allure /usr/local/bin/allure || true

      - name: Generate Allure Report
        if: always()
        run: |
          mkdir -p target/allure-results
          allure generate target/allure-results --clean -o allure-report

      - name: Upload report for Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: allure-report

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
